# Local and M0 stack (plan.md, R-017). Configuration only from env_file; no secret in this file.
# The database is not published to the host. HTTPS termination is provided by a reverse proxy
# (deploy/reverse-proxy/README.md) and is the only public entry point.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SALESAGENT_DB_USER:?set in env_file}
      POSTGRES_DB: ${SALESAGENT_DB_NAME:?set in env_file}
      POSTGRES_PASSWORD: ${SALESAGENT_DB_PASSWORD:?set in env_file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      SALESAGENT_DB_HOST: db
      SALESAGENT_DB_PORT: "5432"
    depends_on:
      - db
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      SALESAGENT_DB_HOST: db
      SALESAGENT_DB_PORT: "5432"
    command: ["python", "manage.py", "process_inbox", "--interval", "2"]
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
